name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest

    # Same image as docker-compose.yml, so tests run against the same Postgres + pgvector
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: lakshya
          POSTGRES_PASSWORD: lakshya-ci-password
          POSTGRES_DB: lakshya_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lakshya -d lakshya_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://lakshya:lakshya-ci-password@localhost:5433/lakshya_test
      TEST_DATABASE_URL: postgresql+psycopg://lakshya:lakshya-ci-password@localhost:5433/lakshya_test

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest
