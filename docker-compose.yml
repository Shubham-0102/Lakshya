# Postgres (with pgvector), Redis, and the scheduled scraper (Celery worker + Beat).
# Settings come from .env (copy .env.example to .env first).
name: lakshya

# One image for everything Python; each service only changes the command
x-scraper: &scraper
  build:
    context: .
    dockerfile: docker/scraper/Dockerfile
  image: lakshya-scraper
  env_file: .env
  environment:
    # Inside Docker the database and Redis are reached by service name, not localhost
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to 127.0.0.1 so only this machine can connect, not the local network.
      # Host port 5433 avoids clashing with a Postgres already running on 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, the first time the database volume is created.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.3-alpine
    # No persistence: Redis is only a task queue, and the next scheduled run re-sends lost tasks.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs once at startup, so tables and sources exist before the worker starts
  migrate:
    <<: *scraper
    command: sh -c "alembic upgrade head && python -m lakshya_scraper.sync_sources"
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *scraper
    command: celery -A lakshya_scraper.celery_app worker --loglevel=INFO
    init: true # reaps the Chromium processes each run leaves behind
    shm_size: 1gb # Chromium crashes with Docker's default 64 MB of shared memory
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Keep exactly one: two Beats would send every scheduled run twice
  beat:
    <<: *scraper
    # The schedule file only remembers the last run, so losing it with the container is fine
    command: celery -A lakshya_scraper.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
