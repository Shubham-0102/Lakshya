[project]
name = "lakshya-scraper"
version = "0.1.0"
description = "Lakshya scrapers, cleaning, deduplication and scheduled tasks"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "celery[redis]>=5.6.3",
    "lakshya-backend",
    "lxml>=6.1.3",
    "nepali-datetime>=1.0.8.5",
    "playwright>=1.64.1",
    "pyyaml>=6.0.3",
    # kombu (Celery's messaging library) only supports redis-py below 6.5
    "redis>=6.4.0,<6.5",
]

[tool.uv.sources]
lakshya-backend = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
