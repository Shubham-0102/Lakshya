# Every source we have reviewed, with its compliance verdict. Quotes and details: docs/sources.md
# Only "approved" sources can be enabled; the database rejects anything else.
# Load into the database:  uv run python -m lakshya_scraper.sync_sources
# Removing an entry here does not delete it from the database; set enabled: false instead.

sources:
